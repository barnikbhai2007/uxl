name: Deploy UXL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}

        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'

            set -e

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            nvm use 22

            echo "Node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "PM2: $(pm2 -v)"

            echo "=== Preparing UXL ==="

            if [ ! -d /opt/uxl/.git ]; then
              echo "UXL not found. Cloning..."

              sudo mkdir -p /opt/uxl
              sudo chown -R "$USER:$USER" /opt/uxl

              git clone https://github.com/barnikbhai2007/uxl.git /opt/uxl
            fi

            cd /opt/uxl

            echo "=== Updating source ==="

            git fetch origin
            git reset --hard origin/main

            echo "=== Installing dependencies ==="

            # Stop the running app before replacing dependencies. This prevents
            # npm from racing with files held by the live Node process.
            if pm2 describe uxl > /dev/null 2>&1; then
              echo "Stopping UXL temporarily for a clean dependency install."
              pm2 stop uxl || true
            fi

            NODE_MODULES_BACKUP="/opt/uxl/node_modules.previous.$(date +%s)"
            if [ -d node_modules ]; then
              mv node_modules "$NODE_MODULES_BACKUP"
            fi

            # Keep the lockfile synchronized when a production dependency is added.
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci

            echo "=== Building frontend ==="

            npm run build

            echo "=== Smoke testing production server ==="

            SMOKE_LOG="/tmp/uxl-smoke.log"
            NODE_ENV=production PORT=3101 npx tsx server.ts > "$SMOKE_LOG" 2>&1 &
            SMOKE_PID=$!

            SMOKE_OK=0
            for i in {1..20}; do
              if curl -fsS http://127.0.0.1:3101/ > /dev/null 2>&1; then
                SMOKE_OK=1
                break
              fi
              if ! kill -0 "$SMOKE_PID" > /dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            kill "$SMOKE_PID" > /dev/null 2>&1 || true
            wait "$SMOKE_PID" > /dev/null 2>&1 || true

            if [ "$SMOKE_OK" -ne 1 ]; then
              echo "=== Production smoke test FAILED ==="
              cat "$SMOKE_LOG"
              exit 1
            fi

            echo "=== Starting UXL ==="

            if pm2 describe uxl > /dev/null 2>&1; then

              echo "Existing UXL process found."
              pm2 restart uxl --update-env

            else

              echo "Starting UXL for the first time."

              NODE_ENV=production \
              pm2 start "npx tsx server.ts" \
                --name uxl \
                --cwd /opt/uxl \
                --update-env

            fi

            pm2 save

            # Fresh deployment is now active; old dependencies are no longer needed.
            if [ -n "$NODE_MODULES_BACKUP" ] && [ -d "$NODE_MODULES_BACKUP" ]; then
              rm -rf "$NODE_MODULES_BACKUP" || true
            fi

            echo "=== Deployment complete ==="

            pm2 status

          EOF

# deployment trigger
