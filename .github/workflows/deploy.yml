name: Deploy UXL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}

        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'

            set -e

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            nvm use 22

            echo "Node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "PM2: $(pm2 -v)"

            echo "=== Preparing UXL ==="

            if [ ! -d /opt/uxl/.git ]; then
              echo "UXL not found. Cloning..."

              sudo mkdir -p /opt/uxl
              sudo chown -R "$USER:$USER" /opt/uxl

              git clone https://github.com/barnikbhai2007/uxl.git /opt/uxl
            fi

            cd /opt/uxl

            echo "=== Updating source ==="

            git fetch origin
            git reset --hard origin/main

            echo "=== Installing dependencies ==="

            rm -rf node_modules
            npm ci

            echo "=== Building frontend ==="

            npm run build

            echo "=== Starting UXL ==="

            if pm2 describe uxl > /dev/null 2>&1; then

              echo "Existing UXL process found."
              pm2 restart uxl --update-env

            else

              echo "Starting UXL for the first time."

              NODE_ENV=production \
              pm2 start "npx tsx server.ts" \
                --name uxl \
                --cwd /opt/uxl \
                --update-env

            fi

            pm2 save

            echo "=== Deployment complete ==="

            pm2 status

          EOF

# deployment trigger
